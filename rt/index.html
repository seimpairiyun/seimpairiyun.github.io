<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#f0f9ff" />
        <title>Seimpairiyun Galaxy</title>

        <style>
            :root {
                --bg: #f0f9ff;
                --text: #0f172a;
                --muted: #64748b;
                --primary: #0d9488;
                --border: #e2edf5;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 24px;
                font-family:
                    Inter,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                color: var(--text);
                background:
                    radial-gradient(
                        ellipse at 10% 15%,
                        #5eead452,
                        transparent 36%
                    ),
                    radial-gradient(
                        ellipse at 90% 85%,
                        #7dd3fc57,
                        transparent 38%
                    ),
                    var(--bg);
            }

            .card {
                width: 100%;
                max-width: 450px;
                padding: 30px;
                border: 1px solid #ffffff;
                border-radius: 28px;
                background: #ffffffc7;
                box-shadow: 0 24px 80px #3864821a;
                backdrop-filter: blur(18px);
                animation: appear 0.7s ease both;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 12px;
                padding-bottom: 24px;
                border-bottom: 1px solid var(--border);
            }

            .logo {
                width: 46px;
                height: 46px;
                flex-shrink: 0;
                overflow: hidden;
                border-radius: 15px;
                background: #ffffff;
            }

            .logo img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .brand-name {
                font-size: 16px;
                font-weight: 850;
                letter-spacing: 1.2px;
            }

            .brand-sub {
                margin-top: 4px;
                color: var(--muted);
                font-size: 10px;
            }

            .content {
                padding: 34px 0 28px;
                text-align: center;
            }

            h1 {
                font-size: clamp(27px, 6vw, 35px);
                line-height: 1.15;
                letter-spacing: -1.3px;
            }

            .description {
                max-width: 330px;
                margin: 15px auto 0;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.8;
            }

            .countdown {
                margin-top: 24px;
                color: var(--muted);
                font-size: 12px;
            }

            .countdown strong {
                color: var(--primary);
            }

            .progress {
                height: 4px;
                margin-top: 13px;
                overflow: hidden;
                border-radius: 10px;
                background: #e2e8f0;
            }

            .progress-bar {
                width: 100%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, #2dd4bf, #38bdf8);
                transform-origin: left;
                animation: progress 3s linear forwards;
            }

            footer {
                padding-top: 22px;
                border-top: 1px solid var(--border);
                color: #94a3b8;
                font-size: 10px;
                font-weight: 650;
                letter-spacing: 1.5px;
                text-align: center;
            }

            @keyframes appear {
                from {
                    opacity: 0;
                    transform: translateY(18px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes progress {
                to {
                    transform: scaleX(0);
                }
            }

            @media (max-width: 480px) {
                body {
                    padding: 16px;
                }
                .card {
                    padding: 23px;
                    border-radius: 24px;
                }
                .content {
                    padding: 30px 0 25px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>
    </head>

    <body>
        <main class="card">
            <header class="brand">
                <div class="logo">
                    <img
                        src="https://seimpairiyun.thedev.id/img/logo2.png"
                        alt="Logo Seimpairiyun"
                    />
                </div>

                <div>
                    <div class="brand-name">Redirect link</div>
                </div>
            </header>

            <section class="content">
                <h1>Reform DZV!</h1>

                <p class="description">
                    Siap Mantap, Salam Satu Bahu, Semangat dalam Kebersamaan,
                    Lanjutkan ukir prestasi, Tetap Fokus, Jangan Terlena, Pajak
                    Tumbuh, Indonesia Tangguh, <b>Hidup MBG!</b>
                </p>

                <p class="countdown" aria-live="polite">
                    Redirecting in <strong id="timer">3</strong> seconds...
                </p>

                <div class="progress" aria-hidden="true">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </section>

            <footer>DAWET</footer>
        </main>

        <script>
            const DESTINATION = "https://turt-020.web.app/";
            const DELAY = 5;

            const timer = document.getElementById("timer");
            const progressBar = document.getElementById("progressBar");

            progressBar.style.animationDuration = `${DELAY}s`;

            let remaining = DELAY;

            function redirect() {
                window.location.replace(DESTINATION);
            }

            if (DELAY <= 0) {
                redirect();
            } else {
                const interval = setInterval(() => {
                    remaining--;
                    timer.textContent = remaining;

                    if (remaining <= 0) {
                        clearInterval(interval);
                        redirect();
                    }
                }, 1000);
            }
        </script>
    </body>
</html>
